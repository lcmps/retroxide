name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Releases run one at a time so two pushes never compute the same version.
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
        working-directory: frontend

      - name: Check frontend
        run: |
          npm run check
          npm test
          npm run build
        working-directory: frontend

      - name: Vet
        run: go vet ./...
        env:
          CGO_ENABLED: "0"

      - name: Test with race detector
        run: go test -race ./...
        env:
          CGO_ENABLED: "1"

  version:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute next version
        id: next
        run: scripts/next-version.sh
        env:
          NOTES_FILE: release-notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  binaries:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build binaries
        run: make release VERSION=${{ needs.version.outputs.version }}

      - name: Smoke-test linux/amd64 binary
        run: test "$(bin/retroxide-linux-amd64 --version)" = "${{ needs.version.outputs.version }}"

      - name: Write checksums
        run: sha256sum retroxide-* > SHA256SUMS
        working-directory: bin

      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: bin/
          if-no-files-found: error

  container:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.version.outputs.version }}
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [version, binaries, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: bin

      - uses: actions/download-artifact@v8
        with:
          name: release-notes

      - name: Add container instructions to notes
        run: |
          {
            echo
            echo "## Container"
            echo
            echo '```sh'
            echo "docker pull ${IMAGE}:${VERSION#v}"
            echo '```'
          } >> release-notes.md
        env:
          VERSION: ${{ needs.version.outputs.version }}

      - name: Create tag and GitHub release
        run: |
          chmod +x bin/retroxide-*
          gh release create "$VERSION" bin/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
