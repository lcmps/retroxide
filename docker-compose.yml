services:
  retroxide:
    build:
      context: .
      dockerfile: Dockerfile
    image: retroxide-backend:local
    container_name: retroxide-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      RETROXIDE_ENV: prod
      RETROXIDE_HOST: 0.0.0.0
      RETROXIDE_PORT: 3000
      RETROXIDE_DB_DRIVER: sqlite
      RETROXIDE_SQLITE_PATH: /app/retroxide.sqlite3
      RETROXIDE_STORAGE_ROOT: /app/storage
      RETROXIDE_JWT_SECRET: ${RETROXIDE_JWT_SECRET:-change-me-in-production-use-a-long-random-string}
    volumes:
      - ./storage:/app/storage
      - ./retroxide.sqlite3:/app/retroxide.sqlite3
