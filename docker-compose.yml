services:
  retroxide:
    build:
      context: .
      dockerfile: Dockerfile
    image: retroxide:local
    container_name: retroxide
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      RETROXIDE_ENV: prod
      RETROXIDE_HOST: 0.0.0.0
      RETROXIDE_PORT: 3000
      RETROXIDE_CONFIG_FILE: /app/data/retroxide.env
      RETROXIDE_SQLITE_PATH: /app/data/retroxide.sqlite3
      RETROXIDE_STORAGE_ROOT: /app/storage
      # Leave unset to generate a secret through the setup wizard on first run.
      RETROXIDE_JWT_SECRET: ${RETROXIDE_JWT_SECRET:-}
    volumes:
      - retroxide-data:/app/data
      - retroxide-storage:/app/storage

volumes:
  retroxide-data:
  retroxide-storage:
